name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build and deploy"
        required: true
        default: "1.0.0"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/weld-defect-api

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.image_tag || 'dev' }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: devops/docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Helm)
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          helm upgrade --install weld-defect devops/helm/weld-defect \
            --namespace weld-defect --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE }} \
            --set image.tag=${{ needs.build-push.outputs.tag }} \
            --set ingress.enabled=true \
            --set ingress.host=${{ secrets.INGRESS_HOST }} \
            --set secrets.apiKey=${{ secrets.API_KEY }} \
            --set secrets.jwtSecret=${{ secrets.JWT_SECRET }} \
            --wait --timeout 5m

      - name: Smoke test
        run: |
          kubectl -n weld-defect rollout status deploy/weld-api --timeout=5m
          kubectl -n weld-defect port-forward svc/weld-api 8000:80 &
          sleep 5
          curl -fsS http://localhost:8000/health | tee /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json
