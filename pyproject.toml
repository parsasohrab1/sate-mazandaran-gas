[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sate-mazandaran-gas"
version = "1.0.0"
description = "AI-Based Weld Defect Detection in Pipelines — Sate Mazandaran Gas / Petro Pala Toos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — Petro Pala Toos / Sate Mazandaran Gas" }
authors = [
    { name = "Nosratollah Ashrafi-Payaman", email = "ashrafi@khu.ac.ir" },
    { name = "Petro Pala Toos R&D", email = "r&d@petropalatoos.ir" },
]
keywords = ["weld-defect", "pipeline", "ndt", "machine-learning", "computer-vision", "api-1104", "asme"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "Pillow>=10.0",
    "opencv-python-headless>=4.8",
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "albumentations>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "mlflow>=2.8",
    "dvc>=3.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-multipart>=0.0.6",
    "httpx>=0.25",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "pytest-mock>=3.12",
    "hypothesis>=6.92",
    "ruff>=0.1",
    "black>=23.12",
    "mypy>=1.7",
    "bandit>=1.7",
    "pre-commit>=3.6",
]
mlops = [
    "airflow>=2.8",
    "evidently>=0.4",
    "great-expectations>=0.18",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/parsasohrab1/sate-mazandaran-gas"
Documentation = "https://github.com/parsasohrab1/sate-mazandaran-gas/tree/main/docs"
Repository = "https://github.com/parsasohrab1/sate-mazandaran-gas"
"Bug Tracker" = "https://github.com/parsasohrab1/sate-mazandaran-gas/issues"

[project.scripts]
weld-detect-train = "weld_defect.cli:train"
weld-detect-eval = "weld_defect.cli:evaluate"
weld-detect-predict = "weld_defect.cli:predict"
weld-detect-serve = "weld_defect.cli:serve"

[tool.setuptools.packages.find]
where = ["src"]
include = ["weld_defect*"]

[tool.setuptools.package-data]
weld_defect = ["py.typed", "config/*.yaml", "config/*.yml"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --cov=weld_defect --cov-report=term-missing --cov-report=html"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "gpu: marks tests that require a GPU",
]

[tool.coverage.run]
source = ["src/weld_defect"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "PL"]
ignore = ["E501", "PLR0913"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
