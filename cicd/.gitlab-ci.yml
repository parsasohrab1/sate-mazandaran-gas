# GitLab CI pipeline — mirrors the GitHub Actions CI/CD/Security stages.
# Drop this file at the repo root as .gitlab-ci.yml (or include it).
# Stages: lint, test, build, scan, deploy

stages:
  - lint
  - test
  - build
  - scan
  - deploy

variables:
  PYTHON_VERSION: "3.11"
  IMAGE: $CI_REGISTRY_IMAGE/weld-defect-api

.setup: &setup
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt
    - pip install -e .

lint:
  <<: *setup
  stage: lint
  script:
    - ruff check src tests
    - black --check src tests
    - bandit -r src -c pyproject.toml || true

test:
  <<: *setup
  stage: test
  variables:
    MLOPS_SKIP_DVC: "1"
    MLFLOW_TRACKING_URI: "file:./mlruns"
  script:
    - pytest -m "not slow and not gpu and not integration" --cov=weld_defect --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  image: docker:24
  services: [docker:24-dind]
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f devops/docker/Dockerfile.api -t $IMAGE:$CI_COMMIT_SHORT_SHA -t $IMAGE:latest .
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE:latest
  only: [main, tags]

scan:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed $IMAGE:$CI_COMMIT_SHORT_SHA
  only: [main, tags]
  allow_failure: false

deploy:
  stage: deploy
  image: alpine/helm:3.14.0
  before_script:
    - mkdir -p $HOME/.kube
    - echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config
  script:
    - helm upgrade --install weld-defect devops/helm/weld-defect
        --namespace weld-defect --create-namespace
        --set image.repository=$IMAGE --set image.tag=$CI_COMMIT_SHORT_SHA
        --set ingress.enabled=true --set ingress.host=$INGRESS_HOST
        --set secrets.apiKey=$API_KEY --set secrets.jwtSecret=$JWT_SECRET
        --wait --timeout 5m
  environment:
    name: production
  only: [main]
  when: manual
