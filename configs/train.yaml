# Training configuration — single source of truth for `make train`.
# Loaded by weld_defect.config.load_config (YAML → dataclass).

experiment:
  name: weld-defect-ensemble-v1
  description: "Multi-model ensemble for weld defect classification (API 1104 classes)."
  seed: 42
  mlflow_tracking_uri: ${MLFLOW_TRACKING_URI,file:./mlruns}
  mlflow_experiment: weld-defect-detection
  mlflow_model_name: weld-defect-ensemble

data:
  root: ${DATA_ROOT,./data}
  train_split: data/processed/train.csv
  val_split: data/processed/val.csv
  test_split: data/processed/test.csv
  image_dir: data/processed/images
  input_size: 224
  channels: 1            # radiographs are single-channel; replicated to 3 for pretrained backbones
  num_classes: 6
  class_names:
    - no_defect          # 0 — sound weld (negative class)
    - porosity           # 1 — گاز/حفره
    - crack              # 2 — ترک
    - lack_of_fusion     # 3 — عدم ادغام
    - undercut           # 4 — کم‌ادبی لبه
    - slag_inclusion     # 5 — آخال سرباره
  class_weights: [1.0, 1.4, 1.6, 1.5, 1.2, 1.3]   # counter class imbalance (set from EDA)

augmentation:
  enabled: true
  policy: albumentations
  ops:
    - { name: HorizontalFlip, p: 0.5 }
    - { name: VerticalFlip, p: 0.2 }
    - { name: Rotate, limit: 15, p: 0.5 }
    - { name: RandomBrightnessContrast, brightness_limit: 0.2, contrast_limit: 0.2, p: 0.5 }
    - { name: GaussianBlur, blur_limit: [3, 5], p: 0.2 }
    - { name: GaussNoise, std_range: [0.03, 0.07], p: 0.2 }
    - { name: CLAHE, clip_limit: 4.0, p: 0.3 }    # enhances radiograph contrast

model:
  architecture: ensemble            # cnn | resnet | efficientnet | ensemble
  members:
    - resnet50
    - efficientnet_b0
    - custom_cnn
  pretrained: true                  # ImageNet weights (transfer learning)
  pooling: avg
  dropout: 0.3
  ensemble_strategy: softmax_avg    # softmax_avg | voting | stacking

training:
  epochs: 40
  batch_size: 32
  num_workers: 4
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: cosine_warm
  warmup_epochs: 3
  early_stopping:
    enabled: true
    patience: 7
    metric: val_f1_macro
    mode: max
  mixed_precision: true
  gradient_clip: 1.0

loss:
  name: focal_loss                  # handles imbalance; alternatives: ce | weighted_ce
  gamma: 2.0
  # Mirrors data.class_weights (kept literal here — config cross-refs are not supported).
  alpha: [1.0, 1.4, 1.6, 1.5, 1.2, 1.3]

metrics:
  primary: f1_macro
  also: [accuracy, precision_macro, recall_macro, balanced_accuracy, roc_auc_ovr]
  confusion_matrix: true
  per_class_report: true

artifacts:
  checkpoint_dir: models/checkpoints
  export_dir: models
  export_formats: [pt, onnx]        # pt for serving, onnx for portability
  log_dir: logs
