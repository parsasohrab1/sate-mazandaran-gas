apiVersion: v1
kind: ConfigMap
metadata:
  name: weld-api-config
  namespace: weld-defect
data:
  APP_ENV: "production"
  APP_LOG_LEVEL: "INFO"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  MODEL_CHECKPOINT: "/models/ensemble_best.pt"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  MLFLOW_EXPERIMENT: "weld-defect-detection"
  MLFLOW_MODEL_NAME: "weld-defect-ensemble"
  DATA_ROOT: "/data"
  API_MAX_UPLOAD_MB: "10"
  API_CONF_THRESHOLD: "0.5"
