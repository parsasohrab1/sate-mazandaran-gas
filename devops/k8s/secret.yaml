# Apply with: kubectl apply -f devops/k8s/secret.yaml
# OR (preferred) generate externally and inject via Sealed-Secret / Vault.
# Do NOT commit real secret values — the placeholders below are for layout only.
apiVersion: v1
kind: Secret
metadata:
  name: weld-api-secret
  namespace: weld-defect
type: Opaque
stringData:
  # Replace before applying. Generate: python -c "import secrets;print(secrets.token_urlsafe(32))"
  API_KEY: "REPLACE_WITH_GENERATED_API_KEY"
  JWT_SECRET: "REPLACE_WITH_GENERATED_JWT_SECRET"
