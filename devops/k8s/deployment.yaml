apiVersion: apps/v1
kind: Deployment
metadata:
  name: weld-api
  namespace: weld-defect
  labels:
    app: weld-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weld-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: weld-api
    spec:
      serviceAccountName: weld-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 0
      containers:
        - name: api
          image: registry/weld-defect-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: weld-api-config
            - secretRef:
                name: weld-api-secret
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
            - name: metrics
              mountPath: /app/metrics
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: weld-models-pvc
        - name: data
          persistentVolumeClaim:
            claimName: weld-data-pvc
        - name: metrics
          emptyDir: {}
