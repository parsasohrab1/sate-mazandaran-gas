apiVersion: v1
kind: ConfigMap
metadata:
  name: weld-api-config
  labels:
    {{- include "weld-defect.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.env.APP_ENV | quote }}
  APP_LOG_LEVEL: {{ .Values.env.APP_LOG_LEVEL | quote }}
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  MODEL_CHECKPOINT: {{ .Values.env.MODEL_CHECKPOINT | quote }}
  DATA_ROOT: {{ .Values.env.DATA_ROOT | quote }}
  MLFLOW_TRACKING_URI: {{ .Values.mlflow.trackingUri | quote }}
  MLFLOW_EXPERIMENT: {{ .Values.mlflow.experiment | quote }}
  MLFLOW_MODEL_NAME: {{ .Values.mlflow.modelName | quote }}
  API_MAX_UPLOAD_MB: {{ .Values.env.API_MAX_UPLOAD_MB | quote }}
  API_CONF_THRESHOLD: {{ .Values.env.API_CONF_THRESHOLD | quote }}
